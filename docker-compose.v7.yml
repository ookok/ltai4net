services:
  postgres_graph:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ltai_graph
      POSTGRES_USER: ltai
      POSTGRES_PASSWORD: ltai_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltai -d ltai_graph"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 3

  qdrant_vector:
    image: qdrant/qdrant:v1.9
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ltai_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "4317:4317"
    environment:
      - ConnectionStrings__Graph=Host=postgres_graph;Database=ltai_graph;Username=ltai;Password=ltai_dev
      - ConnectionStrings__Cache=redis_cache:6379
      - ConnectionStrings__Vector=http://qdrant_vector:6334
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres_graph:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_storage:
