# LTAI — Docker Compose
# Usage: docker compose up -d
# Requires: .env file with DEEPSEEK_API_KEY (or other LLM provider key)

services:
  ltai-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ltai-web
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    env_file:
      - .env
    volumes:
      - ltai-data:/app/.livingtree
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ltai-data:
