window:
  decorations: none
  opacity: 0.95
  padding:
    x: 4
    y: 2
  startup_mode: Maximized
  title: LTAI

font:
  normal:
    family: JetBrainsMono Nerd Font
    style: Regular
  bold:
    family: JetBrainsMono Nerd Font
    style: Bold
  size: 11.0

colors:
  primary:
    background: '#0d1117'
    foreground: '#c9d1d9'
  normal:
    black:   '#484f58'
    red:     '#ff7b72'
    green:   '#3fb950'
    yellow:  '#d29922'
    blue:    '#58a6ff'
    magenta: '#bc8cff'
    cyan:    '#39c5cf'
    white:   '#b1bac4'
  bright:
    black:   '#6e7681'
    red:     '#ffa198'
    green:   '#56d364'
    yellow:  '#e3b341'
    blue:    '#79c0ff'
    magenta: '#d2a8ff'
    cyan:    '#56d4dd'
    white:   '#f0f6fc'

selection:
  semantic_escape_chars: ",│`|:\"' ()[]{}<>\t"
  save_to_clipboard: true

live_config_reload: false
working_directory: .
env:
  TERM: xterm-256color
  LTAI_NO_WT: "1"
