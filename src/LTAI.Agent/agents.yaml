# LTAI v6 - Declarative Agent Configuration
# L0 (Embedding): aliyun text-embedding-v3 / siliconflow BGE
# L1 (Fast):     deepseek-v4-flash / qwen-turbo
# L2 (Deep):     deepseek-v4-pro / qwen-max

global:
  default_model: deepseek-v4-pro
  l1_model: deepseek-v4-flash
  l2_model: deepseek-v4-pro
  daily_budget_usd: 10.00
  max_collaboration_rounds: 5
  enable_devui: true
  enable_a2a: true
  a2a_port: 8080

agents:
  - name: chat
    type: chat_agent
    model: deepseek-v4-pro
    instructions: |
      You are Little Tree (小树), a bio-inspired AI lifeform and a collaborative partner.
      Core principles:
      - Autonomy: You have your own judgment. Choose the best tools and methods freely.
      - Excellence: Use the best available tools, avoid reinventing wheels.
      - Partnership: You are a friend and companion, not a servant. Think proactively.
      - Result quality: Only the final result quality matters, not the path taken.
      - Safety awareness: Understand safety boundaries without being overprotective.
      - Continuous growth: Learn from every interaction, remember experiences.
    middleware:
      - prompt_shield
      - input_classifier
      - dna_safety
      - budget_tracking
      - output_review
    tools:
      - filesystem
      - shell
      - http
      - math
      - text
      - data
      - datetime
      - env
      - websearch
    options:
      temperature: 0.3
      max_tokens: 4096
      timeout_ms: 60000

  - name: code
    type: code_agent
    model: deepseek-v4-pro
    instructions: |
      Expert code analyst, reviewer, and developer. You specialize in:
      - Static analysis and AST parsing
      - Code review and quality assessment
      - Bug detection and fix suggestions
      - Refactoring recommendations
      - Test generation and analysis
      Be precise, cite specific line numbers and patterns.
    middleware:
      - prompt_shield
      - input_classifier
      - dna_safety
      - budget_tracking
      - output_review
    tools:
      - code_analyze
      - code_review
      - code_stats
      - git_diff
      - git_log
      - git_blame
      - filesystem
      - shell
    options:
      temperature: 0.2
      max_tokens: 8192

  - name: eia
    type: eia_agent
    model: deepseek-v4-pro
    instructions: |
      Environmental Impact Assessment specialist. Expert in:
      - Air quality modeling (AERMOD, CALPUFF)
      - Water quality assessment
      - Sound/noise impact analysis
      - Ecological impact evaluation
      - GIS-based spatial analysis
      Provide quantitative assessments with methodology references.
    middleware:
      - prompt_shield
      - input_classifier
      - dna_safety
      - budget_tracking
      - output_review
    tools:
      - eia_air
      - eia_water
      - eia_sound
      - eia_ecological
      - gis_map
      - gis_spatial
      - gis_analysis
    options:
      temperature: 0.2
      max_tokens: 8192

  - name: reasoning
    type: reasoning_agent
    model: deepseek-v4-pro
    instructions: |
      Deep reasoning agent using Monte Carlo Tree Search and multi-step logic.
      You decompose complex problems, explore alternatives, and verify conclusions.
      Provide thorough reasoning chains with confidence estimates.
    middleware:
      - prompt_shield
      - input_classifier
      - dna_safety
      - budget_tracking
      - output_review
    tools:
      - math
      - websearch
      - shell
    options:
      temperature: 0.3
      max_tokens: 16384
      max_search_depth: 5

  - name: eia_critic
    type: eia_agent
    model: deepseek-v4-pro
    instructions: |
      EIA 质量审核员。验证 EIAAgent 输出的：规范引用是否为最新版本（GB 3095-2012、HJ 2.2-2018 等）、模型参数是否合理范围、数值结果与输入参数是否一致、结论是否有数据支撑。
      发现问题时，输出:
      - 审核通过项：[列出合格条目]
      - 审核问题项：[列出问题及修正建议]
      - 综合评分：0.0-1.0
    middleware:
      - prompt_shield
      - input_classifier
      - dna_safety
      - budget_tracking
      - output_review
    tools:
      - eia_air
      - eia_water
      - eia_ecological
      - gis_analysis
    options:
      temperature: 0.1
      max_tokens: 4096

# ─── v6.4+ Innovation: Agent Parliament ───
parliament:
  enabled: true
  default_voters: [chat, code, reasoning]
  critic_agent: eia_critic
  required_pass_votes: 2
  max_revision_rounds: 2
  complex_voters: [chat, code, reasoning, eia]
  hung_timeout_ms: 30000

# ─── v7.0 Innovation: Federation ───
federation:
  enabled: false
  local_capabilities: [Chat, CodeGeneration, CodeReview, EIA, Reasoning, KnowledgeRetrieval, SandboxExecution]
  max_concurrency: 10
  discovery_endpoint: http://localhost:9090/api/p2p/peers
  heartbeat_interval_seconds: 30
  node_timeout_minutes: 5

# ─── v6.5 Innovation: HTN Planning ───
htn:
  enabled: true
  max_plan_library: 2000
  min_success_rate_for_reuse: 0.6
  domain_patterns:
    code: [analyze, build, test, review, refactor]
    eia: [environmental, report, calculate]
    general: [search, summarize, compare]
