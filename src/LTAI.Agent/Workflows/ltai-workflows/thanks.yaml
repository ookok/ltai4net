#
# Thanks fast-path workflow.
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: workflow_thanks
  actions:

    - kind: SetVariable
      id: set_normalized
      variable: Local.NormalizedText
      value: =Lower(Trim(System.LastMessage.Text))

    # ── English thanks ──
    - kind: ConditionGroup
      id: is_thanks_en
      conditions:
        - condition: >-
            StartsWith(Local.NormalizedText, "thanks")
            || StartsWith(Local.NormalizedText, "thank you")
            || StartsWith(Local.NormalizedText, "thank")
            || StartsWith(Local.NormalizedText, "thx")
            || StartsWith(Local.NormalizedText, "ty")
            || StartsWith(Local.NormalizedText, "cheers")
            || StartsWith(Local.NormalizedText, "appreciate")
          id: cond_thanks_en
          actions:
            - kind: SendActivity
              id: send_thanks_en
              activity: "You're welcome 😊 Anything else I can help with?"

        # ── Chinese thanks ──
        - condition: >-
            StartsWith(Local.NormalizedText, "谢谢")
            || StartsWith(Local.NormalizedText, "感谢")
            || StartsWith(Local.NormalizedText, "多谢")
            || StartsWith(Local.NormalizedText, "辛苦")
          id: cond_thanks_zh
          actions:
            - kind: SendActivity
              id: send_thanks_zh
              activity: "不客气 😊 还有什么需要帮忙的吗？"
