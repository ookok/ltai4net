#
# Test / presence ping + garbage fallback fast-path workflow.
# This is the LAST fallback workflow in the chain: only fires if
# greeting/thanks/farewell/probing all returned null.
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: workflow_test
  actions:

    - kind: SetVariable
      id: set_normalized
      variable: Local.NormalizedText
      value: =Lower(Trim(System.LastMessage.Text))

    # ── Test / presence ping ──
    - kind: ConditionGroup
      id: is_test
      conditions:
        - condition: >-
            StartsWith(Local.NormalizedText, "test")
            || StartsWith(Local.NormalizedText, "testing")
            || StartsWith(Local.NormalizedText, "ping")
            || StartsWith(Local.NormalizedText, "在吗")
            || StartsWith(Local.NormalizedText, "在不在")
          id: cond_test
          actions:
            - kind: SendActivity
              id: send_test
              activity: "I'm here ✅ Ready to start. What would you like to do?"

      # ── Garbage / very-short / unrecognizable fallback ──
      elseActions:
        - kind: ConditionGroup
          id: is_garbage
          conditions:
            - condition: >-
                Length(Local.NormalizedText) < 3
                || StartsWith(Local.NormalizedText, "asdf")
                || StartsWith(Local.NormalizedText, "asdfghjkl")
                || StartsWith(Local.NormalizedText, "qwerty")
                || StartsWith(Local.NormalizedText, "qwertyuiop")
                || StartsWith(Local.NormalizedText, "zxcvbnm")
                || StartsWith(Local.NormalizedText, "aaaaa")
                || StartsWith(Local.NormalizedText, "bbbbb")
                || StartsWith(Local.NormalizedText, "hhhhh")
                || StartsWith(Local.NormalizedText, "jjjjj")
                || StartsWith(Local.NormalizedText, "kkkkk")
                || StartsWith(Local.NormalizedText, "fffff")
                || StartsWith(Local.NormalizedText, "ddddd")
                || StartsWith(Local.NormalizedText, "sssss")
                || StartsWith(Local.NormalizedText, "ttttt")
                || StartsWith(Local.NormalizedText, "啊啊啊")
                || StartsWith(Local.NormalizedText, "呜呜呜")
                || StartsWith(Local.NormalizedText, "哈哈哈")
              id: cond_garbage_short
              actions:
                - kind: SendActivity
                  id: send_garbage
                  activity: "我没太明白你的意思 🤔 (I didn't quite catch that.) Could you rephrase or type 'help' to see what I can do?"
