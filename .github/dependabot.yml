version: 2
updates:
  # NuGet 依赖自动更新 — 每周一检查，创建 PR
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "auto-update"
    # 只关注 MAF 相关包，避免非 MAF 包升级的噪音
    allow:
      - dependency-name: "Microsoft.Agents.AI*"
    # 给 MAF 浮动范围开绿灯 — CPM 已通过属性管理
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      include: "scope"
