version: 2
updates:

  - package-ecosystem: "nuget"
    directory: "/src/LTAI.Agent"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    allow:
      - dependency-name: "Microsoft.Agents.AI*"
    labels:
      - "dependencies"
      - "agent-framework"
    open-pull-requests-limit: 3
    assignees:
      - "developer"
    commit-message:
      prefix: "deps(agent)"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/src/LTAI.Tools"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    allow:
      - dependency-name: "Microsoft.Agents.AI*"
    labels:
      - "dependencies"
      - "agent-framework"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(tools)"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "Microsoft.Agents.AI*"
