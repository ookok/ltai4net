name: Config Safety Check

on:
  pull_request:
    paths:
      - 'src/LTAI.Agent/ServiceCollectionExtensions.cs'
      - 'agents/*.agent.md'
      - 'Directory.Build.props'
      - '**/appsettings*.json'

jobs:
  config-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        run: dotnet build LTAI.sln --no-restore

      - name: Validate Agent Definition Files
        run: |
          for f in agents/*.agent.md; do
            if [ ! -s "$f" ]; then
              echo "⛔ Empty agent definition: $f"
              exit 1
            fi
            echo "✅ Agent definition OK: $f ($(wc -l < $f) lines)"
          done

      - name: Validate App Settings JSON
        run: |
          for f in $(find src -name 'appsettings.json' -o -name 'appsettings.*.json' | grep -v appsettings.Development.json); do
            if [ -f "$f" ] && ! python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "⛔ Invalid JSON: $f"
              exit 1
            fi
            echo "✅ Valid JSON: $f"
          done

      - name: Check for Hardcoded Secrets in Tracked Files
        run: |
          if grep -rqE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,})' --include='*.cs' --include='*.json' --include='*.yaml' --include='*.yml' src/ .github/ 2>/dev/null; then
            echo "⛔ Potential hardcoded secrets detected!"
            grep -rnE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,})' --include='*.cs' --include='*.json' --include='*.yaml' --include='*.yml' src/ .github/
            exit 1
          fi
          echo "✅ No hardcoded secrets in tracked source files."
