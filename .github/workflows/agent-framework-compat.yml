name: Agent Framework Compatibility Gate

on:
  schedule:
    - cron: '0 1 * * *'  # Daily at 09:00 CST (01:00 UTC)
  workflow_dispatch:      # Manual trigger

jobs:
  compat-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package-source: [stable, preview]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Configure NuGet sources
        run: |
          if [ "${{ matrix.package-source }}" = "preview" ]; then
            dotnet nuget add source https://pkgs.dev.azure.com/msresearch/Microsoft.Agents.AI/_packaging/agent-framework/nuget/v3 \
              --name agent-framework-preview || true
          fi

      - name: Restore with latest packages
        run: |
          dotnet restore src/LTAI.Agent/LTAI.Agent.csproj
          dotnet restore src/LTAI.Tools/LTAI.Tools.csproj

      - name: Build affected projects
        run: |
          dotnet build src/LTAI.Agent/LTAI.Agent.csproj --no-restore -warnaserror || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Build dependent projects
        run: |
          dotnet build src/LTAI.Host/LTAI.Host.csproj --no-restore -warnaserror || echo "HOST_BUILD_FAILED=true" >> $GITHUB_ENV
          dotnet build src/LTAI.Cli/LTAI.Cli.csproj --no-restore -warnaserror || echo "CLI_BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Check API compatibility
        run: |
          echo "## Agent Framework Compatibility Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package source:** ${{ matrix.package-source }}" >> $GITHUB_STEP_SUMMARY
          echo "**Checked at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          DOTNET_VERSION=$(dotnet --version)
          echo "**SDK:** $DOTNET_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BUILD_FAILED" = "true" ]; then
            echo "⛔ **LTAI.Agent build FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "::error::Agent project build failed — possible breaking change in framework API"
            exit 1
          else
            echo "✅ LTAI.Agent build passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$HOST_BUILD_FAILED" = "true" ]; then
            echo "⚠️ **LTAI.Host build FAILED** (non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ LTAI.Host build passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$CLI_BUILD_FAILED" = "true" ]; then
            echo "⚠️ **LTAI.Cli build FAILED** (non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ LTAI.Cli build passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run agent tests
        if: success() || env.BUILD_FAILED != 'true'
        run: |
          dotnet test tests/LTAI.Tests/LTAI.Tests.csproj \
            --filter "FullyQualifiedName~LTAI.Tests" \
            --no-restore \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: Report test results
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$TESTS_FAILED" = "true" ]; then
            echo "⛔ **Tests FAILED** — possible breaking change" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.package-source }}
          path: tests/LTAI.Tests/TestResults/

  report:
    needs: compat-check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⛔ Agent Framework compatibility check failed — ${new Date().toISOString().split('T')[0]}`,
              body: `Daily compatibility gate failed. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['agent-framework', 'compat-gate', 'bug']
            });
