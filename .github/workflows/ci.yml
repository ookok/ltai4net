name: build-test-publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test

      - name: Publish CLI
        run: dotnet publish src/LTAI.Cli -c Release -o dist/cli

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ltai-cli
          path: dist/cli/
