name: build-test-publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache MAF prebuilt DLLs
        id: cache-maf
        uses: actions/cache@v4
        with:
          path: dist/lib/maf
          key: ${{ runner.os }}-maf-${{ hashFiles('extern/agent-framework/dotnet/**/*.cs', 'scripts/build-maf.ps1') }}

      - name: Build MAF DLLs (if cache miss)
        if: steps.cache-maf.outputs.cache-hit != 'true'
        run: pwsh -File scripts/build-maf.ps1 -NoRestore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Test with coverage
        run: dotnet test --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: "**/TestResults/**/coverage.cobertura.xml"

      - name: Benchmark smoke test
        run: dotnet run --project tests/LTAI.Benchmarks -- smoke

      - name: Publish CLI
        run: dotnet publish src/LTAI.Cli -c Release -o dist/cli --no-self-contained

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ltai-cli
          path: dist/cli/

      - name: Publish Web
        run: dotnet publish src/LTAI.Web -c Release -o dist/web --no-self-contained

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: ltai-web
          path: dist/web/
